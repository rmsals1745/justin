<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBC+ 상담문의</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title">MBC+</h1>
                <p class="hero-subtitle">더 나은 서비스를 위한 당신의 파트너</p>
                <a href="#contact" class="cta-button">상담 신청하기</a>
            </div>
        </div>
    </section>

    <!-- Features Section -->
    <section class="features">
        <div class="container">
            <h2 class="section-title">왜 MBC+를 선택해야 할까요?</h2>
            <div class="features-grid">
                <div class="feature-card">
                    <div class="feature-icon">🚀</div>
                    <h3>빠른 응답</h3>
                    <p>24시간 내 신속한 상담 응답으로 시간을 절약하세요</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">💡</div>
                    <h3>전문 컨설팅</h3>
                    <p>경험 많은 전문가들이 최적의 솔루션을 제공합니다</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">🎯</div>
                    <h3>맞춤형 서비스</h3>
                    <p>고객의 니즈에 맞춘 개인화된 서비스를 경험하세요</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Form Section -->
    <section class="contact" id="contact">
        <div class="container">
            <h2 class="section-title">상담 신청</h2>
            <p class="section-description">아래 정보를 입력해주시면 빠르게 연락드리겠습니다</p>

            <form id="contactForm" class="contact-form">
                <div class="form-group">
                    <label for="name">이름 *</label>
                    <input type="text" id="name" name="name" required placeholder="홍길동">
                </div>

                <div class="form-group">
                    <label for="email">이메일 *</label>
                    <input type="email" id="email" name="email" required placeholder="example@email.com">
                </div>

                <div class="form-group">
                    <label for="phone">전화번호 *</label>
                    <input type="tel" id="phone" name="phone" required placeholder="010-1234-5678">
                </div>

                <div class="form-group">
                    <label for="message">문의 사항 (선택)</label>
                    <textarea id="message" name="message" rows="4" placeholder="상담 받고 싶은 내용을 간단히 적어주세요"></textarea>
                </div>

                <button type="submit" class="submit-button">상담 신청하기</button>
            </form>

            <div id="successMessage" class="success-message" style="display: none;">
                <p>✅ 신청이 완료되었습니다! 빠른 시일 내에 연락드리겠습니다.</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 MBC+. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
